name: validate

# Self-check only: runs the single kernel integrity validator and the local test
# suite (auditor tests + repo-shape guards) on every push and pull request. It
# does not run live target-adapter audits or GitHub traceability scans. It
# performs NO writes: no merge, no issue/label/release changes, no target
# mutation, no auto-progression. PM authority is never automated.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Validate kernel integrity
        run: python -m tools.validate_kernel
      - name: Run portable test suite
        run: python -m pytest tests/ -q
      - name: Run dogfooding test suite
        run: python -m pytest dogfooding/tests/ -q
